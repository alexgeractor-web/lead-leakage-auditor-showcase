name: Studio white-label demo safety smoke
on:
  push:
    paths:
      - 'studio-platform-preview/**'
      - '.github/scripts/check-studio-demo.mjs'
      - '.github/workflows/studio-demo-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test interactive fictional preview without browser network
        run: node .github/scripts/check-studio-demo.mjs
